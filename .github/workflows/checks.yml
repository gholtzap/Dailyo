name: Game checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dailyo
          POSTGRES_PASSWORD: dailyo-test
          POSTGRES_DB: dailyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify Bend laws, compiler output, and rejected regressions
        run: npm run verify
      - run: npm test
      - run: npm run build
      - run: node tests/world-ranking.mjs
      - name: Verify score API with real Postgres
        env:
          DATABASE_URL: postgres://dailyo:dailyo-test@127.0.0.1:5432/dailyo_test
          TRAINROT_TEST_URL: http://127.0.0.1:4174
        run: node scripts/test-score-api.mjs
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify desktop and mobile journeys
        run: |
          python3 -m http.server 4173 --protocol HTTP/1.1 --bind 127.0.0.1 --directory dist > /tmp/trainrot-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
          TRAINROT_TEST_URL=http://127.0.0.1:4173 npm run test:e2e:world
