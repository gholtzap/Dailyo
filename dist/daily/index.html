<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="description" content="Play all seven dailyo games in one sitting.">
  <title>Daily Feed | dailyo</title>
  <link rel="stylesheet" href="/games/world.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/daily/feed.css">
</head>
<body class="daily-feed">
  <header class="site-masthead feed-header">
    <a class="site-brand" href="/">dailyo</a>
    <h1>Daily Feed</h1>
    <p id="feed-progress" role="status" tabindex="-1"></p>
  </header>
  <main class="feed-body" aria-label="Daily games">
    <div id="feed-game"></div>
    <section id="feed-recap" class="main result" hidden>
      <h2 tabindex="-1">Daily recap</h2>
      <ul id="feed-results"></ul>
      <button id="feed-replay" class="secondary" type="button" hidden>Play skipped games</button>
    </section>
  </main>
  <footer class="feed-actions" hidden>
    <button id="feed-skip" class="secondary" type="button">Skip game</button>
    <button id="feed-retry" class="secondary" type="button" hidden>Retry game</button>
    <div id="feed-continue" hidden>
      <button id="feed-next" class="primary" type="button">Next game</button>
      <span class="feed-swipe" aria-hidden="true">Swipe up here</span>
    </div>
  </footer>
  <script type="module" src="/daily/feed.js"></script>
</body>
</html>
