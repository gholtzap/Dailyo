<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1428">
  <meta name="description" content="Play all twenty-one dailyo games in one sitting.">
  <title>Daily mix | dailyo</title>
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/feed.css">
  <link rel="stylesheet" href="/components.css">
<script type="module" src="/site.js"></script>
</head>
<body class="daily-feed">
  <header class="site-masthead feed-header daily-header">
    <a class="site-brand" href="/">dailyo</a>
    <nav class="site-modes" aria-label="Play mode">
      <a href="/daily/" aria-label="Daily mix" aria-current="page">Daily</a>
      <a href="/rush/">Rush</a>
    </nav>
    <p id="feed-progress" role="status" tabindex="-1"></p>
    <details class="site-more feed-directory">
      <summary>Games</summary>
      <nav class="site-more-links" aria-label="Games">
          <a aria-description="Subway routes · Daily and Practice" href="/trainrot/"><span>Subway</span></a>
          <a aria-description="Flags · Daily and Practice" href="/flags/"><span>Flags</span></a>
          <a aria-description="Languages · Daily and Practice" href="/languages/"><span>Languages</span></a>
          <a aria-description="Word meanings · Daily and Practice" href="/vocabulary/"><span>Words</span></a>
          <a aria-description="City locations · Daily and Practice" href="/maprot/"><span>Cities</span></a>
          <a aria-description="Timelines · Daily and Practice" href="/yearrot/"><span>Timeline</span></a>
          <a aria-description="Country routes · Daily and Practice" href="/borderrot/"><span>Borders</span></a>
          <a aria-description="Word ladders · Daily and Practice" href="/ladderrot/"><span>Word ladder</span></a>
          <a aria-description="Clues · Daily and Practice" href="/cluerot/"><span>Clues</span></a>
          <a aria-description="Overhead cities · Daily and Practice" href="/skyrot/"><span>From above</span></a>
          <a aria-description="Prices · Daily and Practice" href="/pricerot/"><span>Prices</span></a>
          <a aria-description="Skylines · Daily and Practice" href="/skylinerot/"><span>Skylines</span></a>
          <a aria-description="Close-up objects · Daily and Practice" href="/zoomrot/"><span>Close-up</span></a>
          <a aria-description="Ordering · Daily and Practice" href="/orderrot/"><span>Ordering</span></a>
          <a href="/trainrot-world/nyc/"><span>Subway cities</span></a>
      </nav>
    </details>
  </header>
  <main class="feed-body" aria-label="Daily games">
    <div id="feed-game"></div>
    <section id="feed-recap" class="main result" hidden>
      <div class="feed-recap-heading">
        <h2 tabindex="-1">Daily recap</h2>
        <span class="feed-recap-copy">
          <button id="feed-copy" class="game-icon copy-icon" type="button" aria-label="Copy results">Copy results</button>
        </span>
      </div>
      <p id="feed-summary"></p>
      <p id="feed-copy-status" role="status"></p>
      <textarea id="feed-copy-text" aria-label="Daily recap to copy" rows="17" readonly hidden></textarea>
      <ul id="feed-results"></ul>
      <button id="feed-replay" class="secondary" type="button" hidden>Play skipped games</button>
    </section>
  </main>
  <footer class="feed-actions" hidden>
    <span class="feed-undo" hidden>
      <button id="feed-undo" class="game-icon" type="button" aria-label="Undo skip" >Undo skip</button>
    </span>
    <button id="feed-retry" class="secondary" type="button" hidden>Retry game</button>
    <button id="feed-skip" type="button">Skip game</button>
    <div id="feed-continue" hidden>
      <button id="feed-next" class="primary" type="button">Next game</button>
    </div>
  </footer>
  <script type="module" src="/daily/feed.js"></script>
</body>
</html>
