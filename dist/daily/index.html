<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="description" content="Play all eleven dailyo games in one sitting.">
  <title>Daily Feed | dailyo</title>
  <link rel="stylesheet" href="/games/world.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="/daily/feed.css">
</head>
<body class="daily-feed">
  <header class="site-masthead feed-header">
    <a class="site-brand" href="/">dailyo</a>
    <h1 class="home-star">Daily Feed</h1>
    <p id="feed-progress" role="status" tabindex="-1"></p>
    <a class="feed-link" href="/">Rush</a>
    <details class="feed-directory">
      <summary>Games</summary>
      <nav aria-label="Games">
        <a href="/trainrot/">trainrot</a>
        <a href="/flags/">flagrot</a>
        <a href="/languages/">langrot</a>
        <a href="/vocabulary/">Vocabulary</a>
        <a href="/maprot/">maprot</a>
        <a href="/yearrot/">yearrot</a>
        <a href="/borderrot/">borderrot</a>
        <a href="/ladderrot/">ladderrot</a>
        <a href="/cluerot/">cluerot</a>
        <a href="/scalerot/">scalerot</a>
        <a href="/swaprot/">swaprot</a>
      </nav>
    </details>
  </header>
  <main class="feed-body" aria-label="Daily games">
    <div id="feed-game"></div>
    <section id="feed-recap" class="main result" hidden>
      <div class="feed-recap-heading">
        <h2 tabindex="-1">Daily recap</h2>
        <span class="feed-recap-copy">
          <button id="feed-copy" class="game-icon copy-icon" type="button" aria-label="Copy daily recap" data-ui-tooltip="feed-copy-tip"></button>
          <span id="feed-copy-tip" class="game-tooltip" role="tooltip">Copy daily recap</span>
        </span>
      </div>
      <p id="feed-copy-status" role="status"></p>
      <textarea id="feed-copy-text" aria-label="Daily recap to copy" rows="17" readonly hidden></textarea>
      <ul id="feed-results"></ul>
      <button id="feed-replay" class="secondary" type="button" hidden>Play skipped games</button>
    </section>
  </main>
  <footer class="feed-actions" hidden>
    <span class="feed-undo" hidden>
      <button id="feed-undo" class="game-icon" type="button" aria-label="Undo skip" data-ui-tooltip="undo-tooltip"></button>
      <span id="undo-tooltip" class="game-tooltip" role="tooltip">Undo skip</span>
    </span>
    <button id="feed-skip" class="secondary" type="button">Skip game</button>
    <button id="feed-retry" class="secondary" type="button" hidden>Retry game</button>
    <div id="feed-continue" hidden>
      <button id="feed-next" class="primary" type="button">Next game</button>
      <span class="feed-swipe" aria-hidden="true">Swipe up here</span>
    </div>
  </footer>
  <script type="module" src="/daily/feed.js"></script>
</body>
</html>
