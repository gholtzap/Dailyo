<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="description" content="Find rail routes in Santiago. Play the daily journey or practice, then explore 98 cities.">
  <title>Santiago · trainrot world | dailyo</title>
  <link rel="icon" type="image/png" href="/assets/train-logo.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/world.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/rewards.css">
  <link rel="stylesheet" href="/site.css">
  <script type="module" src="/site.js"></script>
  <link rel="canonical" href="https://trainrot.vercel.app/trainrot-world/santiago/">
</head>
<body data-world-city="santiago">
  <header class="site-masthead">
    <a class="site-brand" href="/">dailyo</a>
    <nav class="site-modes" aria-label="Play mode">
      <a href="/daily/" aria-label="Daily Feed">Daily</a>
      <a href="/rush/">Rush</a>
    </nav>

    <details class="site-more">
      <summary>Games</summary>
      <nav class="site-more-links" aria-label="Games">
          <a href="/trainrot/">trainrot</a>
          <a href="/flags/">flagrot</a>
          <a href="/languages/">langrot</a>
          <a href="/vocabulary/">Vocabulary</a>
          <a href="/maprot/">maprot</a>
          <a href="/yearrot/">yearrot</a>
          <a href="/borderrot/">borderrot</a>
          <a href="/ladderrot/">ladderrot</a>
          <a href="/cluerot/">cluerot</a>
          <a href="/scalerot/">scalerot</a>
          <a href="/swaprot/">swaprot</a>
          <a href="/skyrot/">skyrot</a>
          <a href="/pricerot/">pricerot</a>
          <a href="/skylinerot/">skylinerot</a>
          <a href="/zoomrot/">zoomrot</a>
          <a href="/orderrot/">orderrot</a>
          <a class="repository-link" href="https://github.com/gholtzap/Dailyo" target="_blank" rel="noopener noreferrer">GitHub repository</a>
      </nav>
    </details>
  </header>

  <div class="site-header">
    <div class="game-modes" role="group" aria-label="Game mode"><button id="daily-mode" aria-pressed="true">Daily</button><button id="practice-mode" aria-pressed="false">Practice</button></div>
    <label class="difficulty-control">Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
  </div>
  <main class="game-layout" id="app">
    <section class="planner" aria-label="Plan your journey"><div class="loading" role="status">Loading rail network…</div></section>
    <section class="map-panel" aria-label="Rail map">
      <div class="map-caption" hidden><span id="map-caption" hidden></span></div>
      <svg id="city-map" role="img" aria-label="Rail map. Start and finish markers are shown; subway lines are hidden." viewBox="0 0 1000 900" tabindex="0"><title>Rail puzzle map</title></svg>
      <span class="demo-map-label" hidden></span>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
