<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1428">
  <meta name="description" content="Find rail routes in Munich. Play the daily journey or practice, then explore 98 cities.">
  <title>Munich · Subway | dailyo</title>
  <link rel="icon" type="image/png" href="/assets/train-logo.png">
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/subway.css">
  <link rel="stylesheet" href="/components.css">
<script type="module" src="/site.js"></script>
  <link rel="canonical" href="https://trainrot.vercel.app/trainrot-world/munich/">
<link data-puzzle-preload rel="preload" as="fetch" href="/world-data/cities.json" crossorigin>
  <link data-puzzle-preload rel="preload" as="fetch" href="/world-data/munich/network.json" crossorigin>
  <link data-puzzle-preload rel="preload" as="fetch" href="/world-data/munich/boroughs.json" crossorigin>
  <link data-puzzle-preload rel="preload" as="fetch" href="/world-data/munich/challenges.json" crossorigin>
</head>
<body data-world-city="munich">
  <header class="site-masthead">
    <a class="site-brand" href="/">dailyo</a>
    <nav class="site-modes" aria-label="Play mode">
      <a href="/daily/" aria-label="Daily mix">Daily</a>
      <a href="/rush/">Rush</a>
    </nav>

    <details class="site-more">
      <summary>Games</summary>
      <nav class="site-more-links" aria-label="Games">
          <a aria-description="Subway routes · Daily and Practice" href="/trainrot/"><span>Subway</span></a>
          <a aria-description="Flags · Daily and Practice" href="/flags/"><span>Flags</span></a>
          <a aria-description="Languages · Daily and Practice" href="/languages/"><span>Languages</span></a>
          <a aria-description="Word meanings · Daily and Practice" href="/vocabulary/"><span>Words</span></a>
          <a aria-description="City locations · Daily and Practice" href="/maprot/"><span>Cities</span></a>
          <a aria-description="Timelines · Daily and Practice" href="/yearrot/"><span>Timeline</span></a>
          <a aria-description="Country routes · Daily and Practice" href="/borderrot/"><span>Borders</span></a>
          <a aria-description="Word ladders · Daily and Practice" href="/ladderrot/"><span>Word ladder</span></a>
          <a aria-description="Clues · Daily and Practice" href="/cluerot/"><span>Clues</span></a>
          <a aria-description="Overhead cities · Daily and Practice" href="/skyrot/"><span>From above</span></a>
          <a aria-description="Prices · Daily and Practice" href="/pricerot/"><span>Prices</span></a>
          <a aria-description="Skylines · Daily and Practice" href="/skylinerot/"><span>Skylines</span></a>
          <a aria-description="Close-up objects · Daily and Practice" href="/zoomrot/"><span>Close-up</span></a>
          <a aria-description="Ordering · Daily and Practice" href="/orderrot/"><span>Ordering</span></a>
          <a aria-description="Swap letters to complete six words · Daily and Practice" href="/wordgrid/"><span>Word grid</span></a>
          <a aria-description="Place one crown in every region · Daily and Practice" href="/crowns/"><span>Crowns</span></a>
          <a aria-description="Connect every square in one path · Daily and Practice" href="/path/"><span>Path</span></a>
          <a href="/trainrot-world/nyc/"><span>Subway cities</span></a>
      </nav>
    </details>
  </header>
  <div class="site-header">
    <div class="game-modes" role="group" aria-label="Game mode"><button id="daily-mode" aria-pressed="true">Daily</button><button id="practice-mode" aria-pressed="false">Practice</button></div>
    <label class="difficulty-control">Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
  </div>
  <main class="game-layout" id="app">
    <section class="planner" aria-label="Plan your journey"><div class="loading" role="status">Loading rail network…</div></section>
    <section class="map-panel" aria-label="Rail map">
      <div class="map-caption" hidden><span id="map-caption" hidden></span></div>
      <svg id="city-map" role="img" aria-label="Rail map. Start and finish markers are shown; subway lines are hidden." viewBox="0 0 1000 900" tabindex="0"><title>Rail puzzle map</title></svg>
      <span class="demo-map-label" hidden></span>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
